services:
  - type: web
    name: line-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NTFY_CHANNEL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
